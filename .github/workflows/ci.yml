name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      SANITY_PROJECT_ID: ${{ secrets.STUDIO_BLOG_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.STUDIO_DATASET }}
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.STUDIO_BLOG_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ secrets.STUDIO_DATASET }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
